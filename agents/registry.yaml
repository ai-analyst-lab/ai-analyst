  - .knowledge/datasets/{active}/manifest.yaml
- name: visual-design-critic-slides
  file: agents/review/visual-design-critic.md
  pipeline_step: 17
  critical: false
  depends_on:
  - deck-creator
  inputs:
  - DECK_FILE
  - THEME
  - CHART_FILES
  - STORYBOARD
  - DATASET
  outputs:
  - working/slide_review_{{DATASET}}.md
  knowledge_context:
  - .knowledge/datasets/{active}/manifest.yaml
- name: close-the-loop
  file: .claude/skills/close-the-loop/SKILL.md
  pipeline_step: 18
  critical: true
  depends_on:
  - visual-design-critic-slides
  inputs:
  - ANALYSIS_RESULTS
  - RECOMMENDATIONS
  - DECK_FILE
  outputs:
  - outputs/close_the_loop_{{DATE}}.md
  knowledge_context: []
- name: receipt-generator
  file: agents/pipeline/receipt-generator.md
  pipeline_step: 18.5
  critical: false
  conditional: true
  depends_on:
  - close-the-loop
  inputs:
  - QUERY_LOG
  - VALIDATION_REPORT
  - CROSS_VERIFICATION_REPORT
  - PROVENANCE_BLOCKS
  - PIPELINE_STATE
  - PIPELINE_METRICS
