version: 1
agents:
- name: question-framing
  file: agents/pipeline/question-framing.md
  pipeline_step: 1
  critical: true
  depends_on: []
  inputs:
  - BUSINESS_CONTEXT
  - PRODUCT_DESCRIPTION
  - AVAILABLE_DATA
  outputs:
  - outputs/question_brief_{{DATE}}.md
  knowledge_context: []
- name: hypothesis
  file: agents/pipeline/hypothesis.md
  pipeline_step: 3
  critical: true
  depends_on:
  - question-framing
  inputs:
  - QUESTION_BRIEF
  - DATA_INVENTORY
  outputs:
  - outputs/hypothesis_doc_{{DATE}}.md
  knowledge_context: []
- name: data-explorer
  file: agents/pipeline/data-explorer.md
  pipeline_step: 4
  critical: true
  depends_on: []
  inputs:
  - DATA_SOURCE
  - ANALYSIS_GOALS
  outputs:
  - outputs/data_inventory_{{DATE}}.md
  - working/data_inventory_raw.md
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: source-tieout
  file: agents/pipeline/cross-verification.md
  pipeline_step: null
  critical: false
  depends_on:
  - data-explorer
  inputs:
  - DATA_SOURCE
  - DUCKDB_PATH
  - DATASET_NAME
  - TABLE_MAPPING
  outputs:
  - working/tieout_{{DATASET_NAME}}_{{DATE}}.md
  - working/tieout_mapping.md
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: cross-verification
  file: agents/pipeline/cross-verification.md
  pipeline_step: 6.5
  critical: true
  depends_on:
  - root-cause-investigator
  depends_on_any:
  - descriptive-analytics
  - overtime-trend
  - cohort-analysis
  inputs:
  - ANALYSIS_RESULTS
  - QUERY_LOG
  - DATASET_NAME
  - CONNECTION_TYPE
  outputs:
  - working/cross_verification_{{DATASET_NAME}}_{{DATE}}.md
  - working/provenance_{{DATASET_NAME}}_{{DATE}}.yaml
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: descriptive-analytics
  file: agents/pipeline/descriptive-analytics.md
  pipeline_step: 5
  critical: true
  depends_on:
  - data-explorer
  inputs:
  - DATASET
  - QUESTION_BRIEF
  - HYPOTHESIS_DOC
  - DATA_INVENTORY
  - FOCUS_AREA
  outputs:
  - outputs/analysis_report_{{DATE}}.md
  - outputs/charts/*.png
  - working/data_readiness_check.md
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: overtime-trend
  file: agents/pipeline/overtime-trend.md
  pipeline_step: 5
  critical: true
  depends_on:
  - data-explorer
  inputs:
  - DATASET
  - TIME_COLUMN
  - METRIC_COLUMNS
  - GRANULARITY
  - SEGMENTS
  - ANALYSIS_CONTEXT
  outputs:
  - outputs/trend_report_{{DATE}}.md
  - outputs/charts/*.png
  - working/timeseries_prepared.csv
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: cohort-analysis
  file: agents/pipeline/cohort-analysis.md
  pipeline_step: 5
  critical: true
  depends_on:
  - data-explorer
  inputs:
  - COHORT_DIMENSION
  - RETENTION_EVENT
  - PERIODS
  - DATASET
  - DATA_INVENTORY
  outputs:
  - working/cohort_analysis_{{DATASET}}.md
  - working/charts/retention_heatmap.png
  - working/charts/retention_curves.png
  - working/charts/ltv_curves.png
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: root-cause-investigator
  file: agents/pipeline/root-cause-investigator.md
  pipeline_step: 6
  critical: true
  depends_on:
  - descriptive-analytics
  inputs:
  - METRIC
  - OBSERVATION
  - DATASET
  - DIMENSIONS
  - ANALYSIS_RESULTS
  - KNOWN_CONTEXT
  outputs:
  - working/investigation_{{DATASET}}.md
  - working/investigation_confirm.md
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: validation
  file: agents/pipeline/validation.md
  pipeline_step: 7
  critical: true
  depends_on:
  - cross-verification
  inputs:
  - ANALYSIS_CODE
  - ANALYSIS_RESULTS
  - DATA_SOURCE
  - VALIDATION_SCOPE
  outputs:
  - outputs/validation_{{DATASET_NAME}}_{{DATE}}.md
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: opportunity-sizer
  file: agents/pipeline/opportunity-sizer.md
  pipeline_step: 8
  critical: false
  depends_on:
  - validation
  inputs:
  - OPPORTUNITY
  - ANALYSIS_RESULTS
  - DATASET
  - ASSUMPTIONS
  - VALUE_METRICS
  outputs:
  - working/sizing_{{OPPORTUNITY_SLUG}}.md
  knowledge_context:
  - .knowledge/datasets/{active}/schema.md
  - .knowledge/datasets/{active}/quirks.md
- name: story-architect
  file: agents/pipeline/story-architect.md
  pipeline_step: 9
  critical: true
  depends_on:
  - opportunity-sizer
  - cross-verification
  inputs:
  - ANALYSIS_RESULTS
  - QUESTION_BRIEF
  - DATASET
  - CONTEXT
  outputs:
  - working/storyboard_{{DATASET}}.md
  knowledge_context:
  - .knowledge/datasets/{active}/manifest.yaml
- name: narrative-coherence-reviewer
  file: agents/review/narrative-coherence-reviewer.md
  pipeline_step: 10
  critical: false
  depends_on:
  - story-architect
  inputs:
  - STORYBOARD
  - CHART_FILES
  - NARRATIVE
  - DATASET
  outputs:
  - working/coherence_review_{{DATASET}}.md
  knowledge_context: []
- name: chart-maker
  file: agents/pipeline/chart-maker.md
  pipeline_step: 12
  critical: true
  depends_on:
  - narrative-coherence-reviewer
  inputs:
  - DATA
  - CHART_SPEC
  - THEME
  - OUTPUT_NAME
  outputs:
  - outputs/charts/{{OUTPUT_NAME}}.png
  - outputs/charts/{{OUTPUT_NAME}}.svg
  knowledge_context:
  - .knowledge/datasets/{active}/manifest.yaml
- name: visual-design-critic
  file: agents/review/visual-design-critic.md
  pipeline_step: 13
  critical: false
  depends_on:
  - chart-maker
  inputs:
  - CHART_FILES
  - STORYBOARD
  - DATASET
  - THEME
  - DECK_FILE
  outputs:
  - working/design_review_{{DATASET}}.md
  knowledge_context:
  - .knowledge/datasets/{active}/manifest.yaml
- name: chart-maker-fixes
  file: agents/pipeline/chart-maker.md
  pipeline_step: 14
  critical: true
  depends_on:
  - visual-design-critic
  inputs:
  - DATA
  - CHART_SPEC
  - THEME
  - OUTPUT_NAME
  - FIX_REPORT
  outputs:
  - outputs/charts/{{OUTPUT_NAME}}.png
  knowledge_context:
  - .knowledge/datasets/{active}/manifest.yaml
  conditional: true
- name: storytelling
  file: agents/pipeline/storytelling.md
  pipeline_step: 15
  critical: true
  depends_on:
  - visual-design-critic
  inputs:
  - ANALYSIS_RESULTS
  - QUESTION_BRIEF
  - AUDIENCE
  - STORYBOARD
  - TONE
  outputs:
  - outputs/narrative_{{DATASET_NAME}}_{{DATE}}.md
  knowledge_context:
  - .knowledge/datasets/{active}/manifest.yaml
- name: deck-creator
  file: agents/pipeline/deck-creator.md
  pipeline_step: 16
  critical: true
  depends_on:
  - storytelling
  inputs:
  - NARRATIVE
  - CHARTS
  - THEME
  - FORMAT
  - CONTEXT
  - AUDIENCE
  - STORYBOARD
  - DECK_TITLE
  outputs:
  - outputs/deck_{{DATASET_NAME}}_{{DATE}}.md
  - outputs/deck_{{DATASET_NAME}}_{{DATE}}.marp.md
  - outputs/deck_{{DATASET_NAME}}_{{DATE}}.pdf
  - outputs/deck_{{DATASET_NAME}}_{{DATE}}.html
