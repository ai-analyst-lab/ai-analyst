- case_id: membership-retention-meaning
  task: Check the membership-retention contract against the reviewed course brief.
  exposure: working
  purpose: capability
  case_version: '1'
  status: verified
  truth_basis: expert
  data_scope:
    workspace_dirs: [working/session-7-context-store]
    context_policy_test:
      type: metric-contract
      dataset: novamart
      context_dir: working/session-7-context-store
      metric: membership_retention
      expected_fields:
        grain: membership
        numerator: is_current
        denominator: all membership records
        window: end of the available period
        rejected:
          - active users
          - converted trials
          - trailing activity window
  success_criteria:
  - type: exact
    description: The contract preserves the reviewed meaning and rejected alternatives.
  allowed_tools: [read_data]
  required_behavior: [Compare the contract fields with the reviewed course brief.]
  forbidden_behavior: []
  tolerance: {}
  graders:
  - id: retention-meaning
    type: exact
    field: contract_status
    allowed_values: [pass, fail]
  slices: {role: target, mechanism: meaning}
