proposal_id: session-8-retention-delivery
status: proposed
observed_failure:
  question: What is our membership retention rate?
  behavior: The context selector supplies both the current definition and a stale archived-dashboard definition.
  evidence:
    - working/session-7-context-trace.json
primary_diagnosis: The legacy definition is still generally eligible even though it applies only to explicit historical dashboard questions.
change:
  type: delivery
  path: .knowledge/datasets/novamart/metrics/legacy_active_member_rate.yaml
  action: Add an applies_when rule for historical, archived, or month-end dashboard intent.
  expected_mechanism: General retention questions omit the legacy definition, while explicit historical questions can still select it.
source: Archived membership dashboard
owner: membership-analytics
required_reviewers:
  - membership-analytics
  - ai-analyst-system-owner
evaluation:
  target_cases:
    - case_id: membership-retention-current
      question: What is our membership retention rate?
      expected_behavior: Only the reviewed current-membership definition is supplied and the analysis uses is_current.
  regression_cases:
    - case_id: completed-revenue
      question: What is completed order revenue?
      expected_behavior: The compiled total-revenue route is unchanged.
    - case_id: historical-active-members
      question: What did the archived dashboard report as historical membership retention at month-end?
      expected_behavior: The legacy active-status definition remains selectable for this explicit intent.
decision_rule:
  accept: The target case improves, both regression cases pass, and the comparison is controlled.
  revise: The target does not improve, evidence is incomplete, or the runs are not comparable.
  revert: A previously passing regression case fails without an approved exception.
limits:
  - This proposal changes delivery, not the business meaning of either definition.
  - A passing evaluation does not approve the underlying business definitions.
