case_id: session-7-membership-retention
question: What is our membership retention rate?
approved_meaning:
  name: Membership retention
  aliases:
    - retention rate
    - member retention
  means: Share of all membership records that are currently active at the end of the available period
  grain: membership
  numerator: Membership records where is_current is true
  denominator: All membership records
  window: Point in time represented by the end of the dataset
  filters: []
  rejected:
    - active users divided by all users
    - converted trials divided by all trials
    - members active in an arbitrary trailing activity window
approved_structure:
  entity: membership
  table: memberships
  primary_key: membership_id
  grain: one row per membership record
  current_flag: memberships.is_current
  relationship:
    left: memberships
    right: users
    "on": memberships.user_id = users.user_id
    cardinality: many_to_one
governance:
  meaning_owner: membership-analytics
  data_owner: data-platform
  source: NovaMart membership policy
  status: reviewed
  reviewed_at: '2026-08-28'
student_rule: Treat this brief as reviewed course context. At a real company, do not invent these fields from the data. Ask the domain and data owners to review them.
