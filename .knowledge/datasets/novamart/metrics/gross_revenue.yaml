id: gross_revenue
name: Gross revenue
aliases:
  - gross merchandise revenue
  - pre-discount merchandise value
means: Pre-discount merchandise value on completed orders, excluding shipping
grain: order
numerator: Sum of orders.subtotal for completed orders
denominator: null
window: Requested order_date window, or the full available period when none is given
filters:
  - orders.status = 'completed'
rejected:
  - orders.total_amount because it is after discounts and includes shipping
  - all order statuses
status: trusted
owner: finance-analytics
source: NovaMart finance policy
last_reviewed: 2026-08-28
usage_checks:
  sql_requires_all:
    - subtotal
    - completed
context_refs:
  - entity:order
  - dimension:order_status
  - filter:completed_orders
  - correction:order-item-fanout
compile:
  measure: SUM(subtotal)
  table: orders
  grain: order
  grain_key: [order_id]
  dimensions:
    order_month: date_trunc('month', order_date)
    device: device
  filters:
    status: status = :status
    date_between: order_date >= :start AND order_date < :end
  requires_columns: [order_id, order_date, subtotal, status]
