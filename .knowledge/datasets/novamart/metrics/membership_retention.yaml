id: membership_retention
name: Membership retention
aliases:
  - retention rate
  - member retention
means: Share of all membership records that are currently active at the end of the available period
grain: membership
numerator: Membership records where is_current is true
denominator: All membership records
window: Point in time represented by the end of the dataset
filters: []
rejected:
  - active users divided by all users
  - converted trials divided by all trials
  - members active in an arbitrary trailing activity window
status: reviewed
owner: membership-analytics
source: NovaMart membership policy
last_reviewed: 2026-08-28
usage_checks:
  sql_requires_all:
    - memberships
    - is_current
context_refs:
  - entity:membership
  - dimension:membership_status
  - filter:current_memberships
