schema_version: 1
dataset: novamart
filters:
  - id: completed_orders
    entity: order
    expression: orders.status = 'completed'
    description: Completed orders only
    status: trusted
    owner: finance-analytics
    last_reviewed: 2026-08-28
  - id: current_memberships
    entity: membership
    expression: memberships.is_current = true
    description: Membership records that are currently active
    status: trusted
    owner: membership-analytics
    last_reviewed: 2026-08-28
