[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-analyst"
version = "3.0.0"
description = "An open-source AI data analyst that runs inside Claude Code"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shane Butler", email = "shane@aianalystlab.ai"},
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "duckdb>=0.9",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "faker>=18.0",
]
causal = [
    "pyfixest>=0.25",
]
warehouses = [
    "psycopg2-binary>=2.9",
    "snowflake-connector-python>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests as integration tests",
    "statistical: marks tests as statistical tests",
]

[tool.setuptools.packages.find]
include = ["helpers*"]
