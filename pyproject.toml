[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-analyst"
version = "1.0.0"
description = "Claude Code-powered product analytics toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shane Butler", email = "shane@aianalystlab.ai"},
]

dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "duckdb>=0.9",
    "pyyaml>=6.0",
]


[tool.setuptools.packages.find]
include = ["helpers*"]
