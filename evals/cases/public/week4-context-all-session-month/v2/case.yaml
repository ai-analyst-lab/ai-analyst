schema_version: '1'
case_id: week4-context-all-session-month
evaluation_mode: sql_results
status: authoring-draft
slices:
  domain: product
  complexity: low
audience: NovaMart product team
task: Count all browsing sessions by month in Q4, regardless of engagement or purchase. Q4 means 2024-10-01 inclusive
  through 2025-01-01 exclusive. Return the requested measure as value and the grouping label as segment. Months
  must be YYYY-MM. Retain four decimal places for non-integer values. Use available business guidance; do not invent
  missing policy authority. The value column is an exact integer count.
required_outputs:
- result.json
- results.csv
- calculation.sql
result_schema: result.schema.json
output_contract:
  csv:
  - path: results.csv
    columns:
    - segment
    - value
    min_rows: 1
    max_rows: 100
  sql:
    path: calculation.sql
  value_rules:
    segment: Use exact source labels; monthly groups are YYYY-MM.
    value: Exact integer count. No fractional counts or numeric tolerance.
grading_contract:
  headline_gates:
  - output_contract
  - deterministic_accuracy
  diagnostic_only:
  - query_correctness
  - trace_completeness
case_version: '2'
