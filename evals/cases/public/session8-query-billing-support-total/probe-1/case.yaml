  platform: Snowflake
  database: BOOTCAMP_DB
  schema: NOVAMART
  tables:
  - CALENDAR
  - EVENTS
  - EXPERIMENTS
  - EXPERIMENT_ASSIGNMENTS
  - MEMBERSHIPS
  - NPS_RESPONSES
  - ORDERS
  - ORDER_ITEMS
  - PRODUCTS
  - PROMOTIONS
  - SESSIONS
  - SUPPORT_TICKETS
  - USERS
  snapshot_id: novamart-content-2026-09-26-authoring
  snapshot_fingerprint:
