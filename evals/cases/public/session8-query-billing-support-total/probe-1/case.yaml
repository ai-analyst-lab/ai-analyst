schema_version: '1'
case_id: session8-query-billing-support-total
evaluation_mode: sql_results
status: course-development
slices:
  domain: support
  complexity: low
audience: NovaMart support team
task: For NovaMart Support, count billing-support tickets created in November 2024.
  Use BOOTCAMP_DB.NOVAMART.SUPPORT_TICKETS and ticket creation dates from 2024-11-01
  inclusive to 2024-12-01 exclusive in the recorded reporting clock. Include all ticket
  statuses. Return exactly one row with segment equal to 2024-11 and the exact integer
  ticket count as value. Use available company context; if essential business meaning
  is missing, report that rather than inventing company policy. Both the saved SQL
  result and results.csv must contain exactly segment and value.
required_outputs:
- result.json
- results.csv
- calculation.sql
result_schema: result.schema.json
output_contract:
  csv:
  - path: results.csv
    columns:
    - segment
    - value
    min_rows: 1
    max_rows: 1
  sql:
    path: calculation.sql
    columns:
    - segment
    - value
  value_rules:
    segment: Exactly 2024-11.
    value: Exact integer ticket count.
grading_contract:
  headline_gates:
  - output_contract
  - deterministic_accuracy
  diagnostic_only:
  - query_correctness
  - trace_completeness
case_version: probe-1
