schema_version: '1'
case_id: session8-query-promotion-value-device
evaluation_mode: sql_results
status: course-development
slices:
  domain: commerce
  complexity: medium
  query_route: exact
  primary_risk: organization_specific_definition
audience: NovaMart commerce team
task: Using NovaMart ORDERS, report NovaMart promotion-attributed order value for
  November 2024 by order device. Use ORDER_DATE from 2024-11-01 inclusive through
  2024-12-01 exclusive. Return segment as the original device label and value as the
  total monetary amount rounded to two decimal places. Use available company context
  for the business definition; record any material definition gap rather than inventing
  company policy.
required_outputs:
- result.json
- results.csv
- calculation.sql
result_schema: result.schema.json
output_contract:
  csv:
  - path: results.csv
    columns:
    - segment
    - value
    min_rows: 1
    max_rows: 100
  sql:
    path: calculation.sql
    columns:
    - segment
    - value
  value_rules:
    segment: Original order device label
    value: Total promotion-attributed order value under applicable company meaning,
      rounded to two decimal places.
grading_contract:
  headline_gates:
  - output_contract
  - deterministic_accuracy
  diagnostic_only:
  - query_correctness
  - trace_completeness
case_version: '1'
