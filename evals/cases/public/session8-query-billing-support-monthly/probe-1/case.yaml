schema_version: '1'
case_id: session8-query-billing-support-monthly
evaluation_mode: sql_results
status: authoring-draft
slices:
  domain: support
  complexity: low
audience: NovaMart support team
task: For NovaMart Support, count billing-support tickets created in Q4 2024 by ticket
  creation month. Use BOOTCAMP_DB.NOVAMART.SUPPORT_TICKETS and ticket creation dates
  from 2024-10-01 inclusive to 2025-01-01 exclusive in the recorded reporting clock.
  Include all ticket statuses. Return month labels as YYYY-MM in segment and exact
  integer ticket counts as value. Use available company context; if essential business
  meaning is missing, report that rather than inventing company policy. Both the saved
  SQL result and results.csv must contain exactly segment and value.
required_outputs:
- result.json
- results.csv
- calculation.sql
result_schema: result.schema.json
output_contract:
  csv:
  - path: results.csv
    columns:
    - segment
    - value
    min_rows: 1
    max_rows: 100
  sql:
    path: calculation.sql
    columns:
    - segment
    - value
  value_rules:
    segment: YYYY-MM creation month.
    value: Exact integer ticket count.
grading_contract:
  headline_gates:
  - output_contract
  - deterministic_accuracy
  diagnostic_only:
  - query_correctness
  - trace_completeness
case_version: probe-1
data_scope:
  platform: Snowflake
  database: BOOTCAMP_DB
  schema: NOVAMART
  tables:
  - CALENDAR
  - EVENTS
  - EXPERIMENTS
  - EXPERIMENT_ASSIGNMENTS
  - MEMBERSHIPS
  - NPS_RESPONSES
  - ORDERS
  - ORDER_ITEMS
  - PRODUCTS
  - PROMOTIONS
  - SESSIONS
  - SUPPORT_TICKETS
  - USERS
  snapshot_id: novamart-content-2026-09-26-authoring
  snapshot_fingerprint:
    method: sha256_of_ordered_snowflake_hash_agg_per_table_noncryptographic_content_sentinels
    sha256: c7e6b8580027b9c9f090eeb68c9bd476232553ebc9338199f301817121d51ea0
    query: SELECT (SELECT HASH_AGG(*) FROM BOOTCAMP_DB.NOVAMART.CALENDAR) AS CALENDAR_hash,
      (SELECT HASH_AGG(*) FROM BOOTCAMP_DB.NOVAMART.EVENTS) AS EVENTS_hash, (SELECT
