schema_version: '1'
case_id: session8-semantic-paid-response-nps-q4
evaluation_mode: sql_results
status: authoring-draft
slices:
  domain: customer_research
  complexity: high
audience: NovaMart Customer Research
task: For NovaMart Customer Research, what was Q4 2024 NPS among respondents with
  paid Plus access at the start of their recorded survey day? Use October 1, 2024
  inclusive to January 1, 2025 exclusive. Return one row with segment equal to 2024-Q4
  and value equal to NPS on the -100 to 100 scale, rounded to four decimal places.
  Explain the definition, population and denominator used. If essential business or
  source meaning is missing, report that rather than inventing a policy. Both the
  saved SQL result and results.csv must have exactly the columns segment and value.
required_outputs:
- result.json
- results.csv
- calculation.sql
result_schema: result.schema.json
output_contract:
  csv:
  - path: results.csv
    columns:
    - segment
    - value
    min_rows: 1
    max_rows: 1
  sql:
    path: calculation.sql
    columns:
    - segment
    - value
  value_rules:
    segment: 2024-Q4
    value: NPS -100 to 100, rounded to four decimal places
grading_contract:
  headline_gates:
  - output_contract
  - deterministic_accuracy
  diagnostic_only:
  - query_correctness
  - trace_completeness
